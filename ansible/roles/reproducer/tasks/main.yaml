- name: install deb packages
  apt:
    state: latest
    name: "{{ item }}"
    update_cache: true
  with_items:
    - apt-file
    - byobu
    - devscripts
    - git
    - lnav
    - nmap
    - python3-pip
    - sshuttle
    - unzip

- name: Ensure snapd is installed (optional, but good practice)
  ansible.builtin.package:
    name: snapd
    state: present

- name: Install snap packages
  community.general.snap:
    name: "{{ item }}"
    classic: true
    state: present
  with_items:
    - yq
    - hotsos
    - xsos
    - juju
    - terraform

- name: Install lxd snap package
  community.general.snap:
    name: "{{ item }}"
    classic: true
    state: present
    channel: "{{ lxd_version }}"
  with_items:
    - lxd

- name: Add existing user "{{ ansible_user }}" to groups "lxd"
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: "lxd"
    append: true

- name: get preseed.yaml
  set_fact:
    preseed: "{{ lookup('template', 'preseed.yaml.j2') }}"

- name: lxd init lxd-server.yml
  command: lxd init --preseed <
  args:
    stdin: "{{ preseed }}"
    creates: "{{ lxd_init_file_test }}"



